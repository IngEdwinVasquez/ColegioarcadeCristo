# Pipeline alternativo (Azure DevOps) de despliegue a Azure Static Web Apps.
# El despliegue principal se hace con GitHub Actions (.github/workflows/azure-static-web-apps.yml).
#
# Defina la variable secreta AZURE_STATIC_WEB_APPS_API_TOKEN en el pipeline
# (Pipelines → Edit → Variables → marcar "Keep this value secret").
# NUNCA escriba el token en este archivo.

trigger:
  branches:
    include:
      - main
      - produccion

pr:
  branches:
    include:
      - main
      - produccion

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: 'Instalar Node.js'
    inputs:
      versionSpec: '20.x'

  - script: |
      npm ci
      npm run lint
      npm run build
    displayName: 'npm ci, lint y build'

  - task: AzureStaticWebApp@0
    displayName: 'Deploy a Azure Static Web Apps'
    inputs:
      app_location: 'dist'
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
