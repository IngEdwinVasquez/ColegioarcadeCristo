# Despliegue continuo a Azure Static Web Apps
# Requiere el secreto de repositorio AZURE_STATIC_WEB_APPS_API_TOKEN
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
name: Azure Static Web Apps CI/CD

# Flujo de ramas: dev → qa → produccion (sin saltar pasos).
# qa se publica en un entorno con nombre propio de Static Web Apps; produccion, en el entorno principal.
on:
  push:
    branches: [main, produccion, qa]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, produccion, qa]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y compilación
        run: |
          npm run lint
          npm run build
        env:
          # Valores públicos de la SPA (también están en .env.production).
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID || 'c69b1c39-4357-4b88-8634-01cde6235549' }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID || 'b5fed600-8da6-43f1-8018-e741824c0e28' }}
          VITE_SPO_HOSTNAME: ${{ vars.VITE_SPO_HOSTNAME }}
          VITE_SPO_SITE_PATH: ${{ vars.VITE_SPO_SITE_PATH || '/sites/IntranetArca' }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
          VITE_POWER_AUTOMATE_MAIL_URL: ${{ vars.VITE_POWER_AUTOMATE_MAIL_URL }}
          VITE_COPILOT_EMBED_URL: ${{ vars.VITE_COPILOT_EMBED_URL }}
          VITE_AI_PROVIDER: ${{ vars.VITE_AI_PROVIDER || 'proxy' }}
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL || 'https://arca-ai-proxy-09061258.azurewebsites.net/api/ai' }}

      - name: Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
          # La rama qa se despliega a un entorno separado (URL propia); produccion/main al entorno principal.
          deployment_environment: ${{ github.ref_name == 'qa' && 'qa' || '' }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cerrar entorno de PR
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
